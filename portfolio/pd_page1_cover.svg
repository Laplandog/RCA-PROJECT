<text x="110" y="390" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="66" font-weight="800" fill="#111a2e" letter-spacing="-2">for an environment</text>
<text x="110" y="460" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="66" font-weight="800" fill="#111a2e" letter-spacing="-2">you cannot feel.</text>
<text x="110" y="530" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" xml:space="preserve"><tspan fill="#57657e" font-weight="400">A </tspan><tspan fill="#57657e" font-weight="400">self-contained </tspan><tspan fill="#57657e" font-weight="400">ambient </tspan><tspan fill="#57657e" font-weight="400">object </tspan><tspan fill="#57657e" font-weight="400">that </tspan><tspan fill="#57657e" font-weight="400">gives </tspan><tspan fill="#57657e" font-weight="400">an </tspan><tspan fill="#57657e" font-weight="400">ecosystem </tspan><tspan fill="#57657e" font-weight="400">a </tspan><tspan fill="#57657e" font-weight="400">body.</tspan></text>
<text x="110" y="564" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" xml:space="preserve"><tspan fill="#57657e" font-weight="400">Environment </tspan><tspan fill="#57657e" font-weight="400">flows </tspan><tspan fill="#57657e" font-weight="400">in </tspan><tspan fill="#57657e" font-weight="400">through </tspan><tspan fill="#57657e" font-weight="400">sensory </tspan><tspan fill="#57657e" font-weight="400">organs; </tspan><tspan fill="#57657e" font-weight="400">a </tspan><tspan fill="#57657e" font-weight="400">liquid </tspan><tspan fill="#57657e" font-weight="400">neural </tspan><tspan fill="#57657e" font-weight="400">network</tspan></text>
<text x="110" y="598" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" xml:space="preserve"><tspan fill="#57657e" font-weight="400">translates </tspan><tspan fill="#57657e" font-weight="400">it </tspan><tspan fill="#57657e" font-weight="400">into </tspan><tspan fill="#57657e" font-weight="400">a </tspan><tspan fill="#57657e" font-weight="400">felt </tspan><tspan fill="#57657e" font-weight="400">state; </tspan><tspan fill="#57657e" font-weight="400">the </tspan><tspan fill="#57657e" font-weight="400">object </tspan><tspan fill="#57657e" font-weight="400">breathes </tspan><tspan fill="#57657e" font-weight="400">it </tspan><tspan fill="#57657e" font-weight="400">back </tspan><tspan fill="#57657e" font-weight="400">as</tspan></text>
<text x="110" y="632" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" xml:space="preserve"><tspan fill="#57657e" font-weight="400">light. </tspan><tspan fill="#57657e" font-weight="400">One </tspan><tspan fill="#57657e" font-weight="400">body </tspan><tspan fill="#57657e" font-weight="400">— </tspan><tspan fill="#57657e" font-weight="400">a </tspan><tspan fill="#2f6f63" font-weight="600">genome </tspan><tspan fill="#57657e" font-weight="400">re-weights </tspan><tspan fill="#57657e" font-weight="400">the </tspan><tspan fill="#57657e" font-weight="400">senses </tspan><tspan fill="#57657e" font-weight="400">so </tspan><tspan fill="#57657e" font-weight="400">it </tspan><tspan fill="#57657e" font-weight="400">can </tspan><tspan fill="#57657e" font-weight="400">inhabit</tspan></text>
<text x="110" y="666" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" xml:space="preserve"><tspan fill="#57657e" font-weight="400">soil, </tspan><tspan fill="#57657e" font-weight="400">water, </tspan><tspan fill="#57657e" font-weight="400">or </tspan><tspan fill="#57657e" font-weight="400">air.</tspan></text>
