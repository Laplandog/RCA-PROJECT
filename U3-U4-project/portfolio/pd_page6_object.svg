<text x="110" y="236" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" xml:space="preserve"><tspan fill="#57657e" font-weight="400">A </tspan><tspan fill="#57657e" font-weight="400">closed, </tspan><tspan fill="#57657e" font-weight="400">egg-like </tspan><tspan fill="#57657e" font-weight="400">form </tspan><tspan fill="#57657e" font-weight="400">that </tspan><tspan fill="#57657e" font-weight="400">sits </tspan><tspan fill="#57657e" font-weight="400">in </tspan><tspan fill="#57657e" font-weight="400">the </tspan><tspan fill="#57657e" font-weight="400">space </tspan><tspan fill="#57657e" font-weight="400">it </tspan><tspan fill="#57657e" font-weight="400">listens </tspan><tspan fill="#57657e" font-weight="400">to </tspan><tspan fill="#57657e" font-weight="400">— </tspan><tspan fill="#57657e" font-weight="400">a </tspan><tspan fill="#57657e" font-weight="400">diffuse </tspan><tspan fill="#57657e" font-weight="400">glowing </tspan><tspan fill="#57657e" font-weight="400">body </tspan><tspan fill="#57657e" font-weight="400">with </tspan><tspan fill="#57657e" font-weight="400">probes </tspan><tspan fill="#57657e" font-weight="400">that </tspan><tspan fill="#57657e" font-weight="400">reach </tspan><tspan fill="#57657e" font-weight="400">into </tspan><tspan fill="#57657e" font-weight="400">soil,</tspan></text>
