<rect x="110" y="360" width="440" height="620" rx="24" fill="#0a0c10" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<rect x="110" y="360" width="440" height="620" rx="24" fill="url(#orbstagebg)"/>
