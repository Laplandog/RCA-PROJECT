<text x="330.0" y="810" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#8b93a3" text-anchor="middle">The light core breathes at ~4.5s</text>
<text x="330.0" y="834" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#8b93a3" text-anchor="middle">calm · secure · quietly growing</text>
<circle cx="616" cy="410.0" r="10" fill="url(#valg)"/>
<text x="640" y="416.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1b2740">Valence</text>
<text x="640" y="438.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" fill="#93a0b4">distress ↔ pleasure</text>
<text x="836" y="416.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#2f6f63">LED hue</text>
<text x="836" y="438.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">Positive </tspan><tspan fill="#5b6a82" font-weight="400">→ </tspan><tspan fill="#5b6a82" font-weight="400">green </tspan><tspan fill="#5b6a82" font-weight="400">/ </tspan><tspan fill="#5b6a82" font-weight="400">cyan; </tspan><tspan fill="#5b6a82" font-weight="400">negative </tspan><tspan fill="#5b6a82" font-weight="400">→ </tspan><tspan fill="#5b6a82" font-weight="400">orange </tspan><tspan fill="#5b6a82" font-weight="400">/ </tspan><tspan fill="#5b6a82" font-weight="400">red; </tspan><tspan fill="#5b6a82" font-weight="400">neutral </tspan><tspan fill="#5b6a82" font-weight="400">→</tspan></text>
<text x="836" y="459.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">warm </tspan><tspan fill="#5b6a82" font-weight="400">white.</tspan></text>
<rect x="606" y="484.0" width="1204" height="1" fill="rgba(20,30,50,0.12)"/>
<circle cx="616" cy="534.0" r="10" fill="#7dd3fc"/>
<text x="640" y="540.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1b2740">Arousal</text>
<text x="640" y="562.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" fill="#93a0b4">calm ↔ aroused</text>
<text x="836" y="540.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#2f6f63">Breathing speed</text>
<text x="836" y="562.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">Low </tspan><tspan fill="#5b6a82" font-weight="400">arousal </tspan><tspan fill="#5b6a82" font-weight="400">→ </tspan><tspan fill="#5b6a82" font-weight="400">slow, </tspan><tspan fill="#5b6a82" font-weight="400">gentle </tspan><tspan fill="#5b6a82" font-weight="400">brightening </tspan><tspan fill="#5b6a82" font-weight="400">and </tspan><tspan fill="#5b6a82" font-weight="400">dimming; </tspan><tspan fill="#5b6a82" font-weight="400">high </tspan><tspan fill="#5b6a82" font-weight="400">→</tspan></text>
<text x="836" y="583.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">quick, </tspan><tspan fill="#5b6a82" font-weight="400">urgent </tspan><tspan fill="#5b6a82" font-weight="400">flicker.</tspan></text>
<rect x="606" y="608.0" width="1204" height="1" fill="rgba(20,30,50,0.12)"/>
<circle cx="616" cy="658.0" r="10" fill="#a5f3e4"/>
<text x="640" y="664.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1b2740">Safety</text>
<text x="640" y="686.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" fill="#93a0b4">alert ↔ secure</text>
<text x="836" y="664.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#2f6f63">Stability</text>
<text x="836" y="686.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">Secure </tspan><tspan fill="#5b6a82" font-weight="400">→ </tspan><tspan fill="#5b6a82" font-weight="400">steady </tspan><tspan fill="#5b6a82" font-weight="400">and </tspan><tspan fill="#5b6a82" font-weight="400">even; </tspan><tspan fill="#5b6a82" font-weight="400">unsafe </tspan><tspan fill="#5b6a82" font-weight="400">→ </tspan><tspan fill="#5b6a82" font-weight="400">a </tspan><tspan fill="#5b6a82" font-weight="400">faint </tspan><tspan fill="#5b6a82" font-weight="400">tremor </tspan><tspan fill="#5b6a82" font-weight="400">or </tspan><tspan fill="#5b6a82" font-weight="400">wavering</tspan></text>
<text x="836" y="707.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">brightness.</tspan></text>
<rect x="606" y="732.0" width="1204" height="1" fill="rgba(20,30,50,0.12)"/>
<circle cx="616" cy="782.0" r="10" fill="#6ee7d0"/>
<text x="640" y="788.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1b2740">Connection</text>
<text x="640" y="810.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" fill="#93a0b4">isolated ↔ answered</text>
<text x="836" y="788.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#2f6f63">Flowing ring</text>
<text x="836" y="810.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">When </tspan><tspan fill="#5b6a82" font-weight="400">it </tspan><tspan fill="#5b6a82" font-weight="400">senses </tspan><tspan fill="#5b6a82" font-weight="400">a </tspan><tspan fill="#5b6a82" font-weight="400">response </tspan><tspan fill="#5b6a82" font-weight="400">— </tspan><tspan fill="#5b6a82" font-weight="400">a </tspan><tspan fill="#5b6a82" font-weight="400">person </tspan><tspan fill="#5b6a82" font-weight="400">nearing, </tspan><tspan fill="#5b6a82" font-weight="400">sound </tspan><tspan fill="#5b6a82" font-weight="400">shifting </tspan><tspan fill="#5b6a82" font-weight="400">—</tspan></text>
<text x="836" y="831.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">a </tspan><tspan fill="#5b6a82" font-weight="400">ring </tspan><tspan fill="#5b6a82" font-weight="400">of </tspan><tspan fill="#5b6a82" font-weight="400">light </tspan><tspan fill="#5b6a82" font-weight="400">flows </tspan><tspan fill="#5b6a82" font-weight="400">around </tspan><tspan fill="#5b6a82" font-weight="400">the </tspan><tspan fill="#5b6a82" font-weight="400">core.</tspan></text>
<rect x="606" y="856.0" width="1204" height="1" fill="rgba(20,30,50,0.12)"/>
<circle cx="616" cy="906.0" r="10" fill="#c9a2ff"/>
<text x="640" y="912.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" font-weight="700" fill="#1b2740">Seeking</text>
<text x="640" y="934.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" fill="#93a0b4">content ↔ needful</text>
<text x="836" y="912.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#2f6f63">Pulse + optional tone</text>
<text x="836" y="934.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">Unrelieved </tspan><tspan fill="#5b6a82" font-weight="400">stress </tspan><tspan fill="#5b6a82" font-weight="400">raises </tspan><tspan fill="#5b6a82" font-weight="400">the </tspan><tspan fill="#5b6a82" font-weight="400">pulse </tspan><tspan fill="#5b6a82" font-weight="400">rate; </tspan><tspan fill="#5b6a82" font-weight="400">sound </tspan><tspan fill="#5b6a82" font-weight="400">is </tspan><tspan fill="#5b6a82" font-weight="400">reserved </tspan><tspan fill="#5b6a82" font-weight="400">for</tspan></text>
<text x="836" y="955.0" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" xml:space="preserve"><tspan fill="#5b6a82" font-weight="400">extremes </tspan><tspan fill="#5b6a82" font-weight="400">— </tspan><tspan fill="#5b6a82" font-weight="400">never </tspan><tspan fill="#5b6a82" font-weight="400">speech.</tspan></text>
<text x="110" y="1034" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#9aa6b8" letter-spacing="2">ANIMA · PRODUCT DESIGN</text><text x="1864" y="1034" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="400" fill="#565e6e" text-anchor="end" letter-spacing="1">05 / 07</text>
