<text x="1810" y="98" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="700" fill="#17b79a" text-anchor="end" letter-spacing="3">PRODUCT DESIGN</text>
<text x="110" y="150" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" font-weight="800" fill="#17b79a" letter-spacing="2">04</text>
<text x="110" y="198" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="46" font-weight="800" fill="#111a2e" letter-spacing="-1">From Feeling to Light</text>
<text x="110" y="236" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" xml:space="preserve"><tspan fill="#57657e" font-weight="400">The </tspan><tspan fill="#57657e" font-weight="400">five-dimensional </tspan><tspan fill="#57657e" font-weight="400">emotion </tspan><tspan fill="#57657e" font-weight="400">becomes </tspan><tspan fill="#57657e" font-weight="400">non-verbal </tspan><tspan fill="#57657e" font-weight="400">physical </tspan><tspan fill="#57657e" font-weight="400">expression. </tspan><tspan fill="#57657e" font-weight="400">It </tspan><tspan fill="#57657e" font-weight="400">conveys </tspan><tspan fill="#2b3852" font-weight="600">what </tspan><tspan fill="#2b3852" font-weight="600">the </tspan><tspan fill="#2b3852" font-weight="600">environment </tspan><tspan fill="#2b3852" font-weight="600">is </tspan><tspan fill="#2b3852" font-weight="600">going </tspan><tspan fill="#2b3852" font-weight="600">through </tspan><tspan fill="#57657e" font-weight="400">—</tspan></text>
<text x="110" y="263" font-family='Inter, "Segoe UI", Helvetica, Arial, sans-serif' font-size="19" xml:space="preserve"><tspan fill="#57657e" font-weight="400">never </tspan><tspan fill="#57657e" font-weight="400">what </tspan><tspan fill="#57657e" font-weight="400">the </tspan><tspan fill="#57657e" font-weight="400">device </tspan><tspan fill="#57657e" font-weight="400">“wants.”</tspan></text>
